name: 버그 제보
description: Safari 번역 툴바의 재현 가능한 문제를 알려 주세요.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. 사이트 주소, 페이지 내용, Apple ID, 개인 파일 경로 등 개인정보는 올리지 마세요.
  - type: input
    id: app-version
    attributes:
      label: 앱 버전
      placeholder: "예: 1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS 및 Safari 버전
      placeholder: "예: macOS 26.0, Safari 26.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 개인정보가 포함되지 않은 공개 페이지나 일반화한 예시로 작성해 주세요.
      placeholder: |
        1. Safari에서 번역 가능한 페이지를 엽니다.
        2. 도구 막대 버튼을 누릅니다.
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 공증된 최신 GitHub Release를 설치했습니다.
          required: true
        - label: 제보 내용과 첨부파일에서 개인정보를 제거했습니다.
          required: true
